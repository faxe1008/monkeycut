name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      QT_VERSION: "6.11.1"
      QT_INSTALL_DIR: qt
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config python3-pip zip \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libglib2.0-0t64 libgl-dev libegl1-mesa-dev \
            libfontconfig1 libdbus-1-3 libxkbcommon0

      - name: Qt (cache)
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: ${{ env.QT_INSTALL_DIR }}
          key: linux-qt-${{ env.QT_VERSION }}

      - if: steps.qt-cache.outputs.cache-hit != 'true'
        name: Qt (aqtinstall)
        run: |
          python3 -m pip install --user aqtinstall
          python3 -m aqt install-qt linux desktop "$QT_VERSION" -O "$QT_INSTALL_DIR"

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=$PWD/qt/${QT_VERSION}/gcc_64

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Package (portable linux bundle)
        run: bash package/package-linux.sh

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: monkeycut-linux
          path: monkeycut-linux-*.zip

  windows:
    runs-on: windows-latest
    # aqtinstall 3.x cannot resolve Qt >= 6.9 module paths for the Windows
    # repository layout (qt6_6111/qt6_6111_msvc2022_64 vs expected
    # qt6_6111/qt6_6111); 6.8.x still uses the layout aqt understands.
    env:
      QT_VERSION: "6.8.3"
    steps:
      - uses: actions/checkout@v4

      - name: Qt (cache)
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: C:\Qt
          key: windows-qt-${{ env.QT_VERSION }}

      - if: steps.qt-cache.outputs.cache-hit != 'true'
        name: Qt (aqtinstall)
        shell: pwsh
        run: |
          py -3 -m pip install --user aqtinstall
          # py7zr (aqt's built-in extractor) fails with Bad7zFile on the
          # Qt 6.8.3 qtbase archive, so use the runner's 7-Zip. Extraction
          # runs single-threaded: parallel 7z processes race on creating
          # C:\Qt\...\msvc2022_64 and one of them exits non-zero, which
          # crashes aqt in its error handling even though every archive
          # had been extracted.
          Set-Content -Path aqt-ci.ini -Value "[aqt]`nconcurrency = 1"
          py -3 -m aqt -c aqt-ci.ini install-qt windows desktop "$env:QT_VERSION" win64_msvc2022_64 -O C:\Qt -E "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path "C:\Qt\$env:QT_VERSION\msvc2022_64\lib\cmake\Qt6\Qt6Config.cmake")) {
            throw "Qt installation incomplete"
          }

      - name: FFmpeg (BtbN shared build)
        shell: pwsh
        run: |
          if (-not (Test-Path ffmpeg)) {
            curl.exe -fL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip
            7z.exe x ffmpeg.zip '-o.' -y | Out-Null
            $src = Get-ChildItem -Path . -Filter ffmpeg-master-latest-win64-gpl-shared -Directory
            Move-Item $src.FullName ffmpeg
          }

      - name: Configure (MSVC + Ninja)
        shell: pwsh
        run: |
          # The bare runner PATH finds MinGW first; the Qt/FFmpeg builds
          # here are MSVC x64, so configure inside vcvars64.
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          & cmd /c "`"$vcvars`" && cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=C:\Qt\$env:QT_VERSION\msvc2022_64 -DFFmpeg_ROOT=$PWD\ffmpeg"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Test
        shell: pwsh
        run: >
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PATH = "C:\Qt\$env:QT_VERSION\msvc2022_64\bin;$PWD\ffmpeg\bin;$env:PATH"
          ctest --test-dir build --output-on-failure

      - name: Install WiX (MSI)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Pinned WiX toolset (v6.0.2 CLI bundle) for the MSI build.
          curl.exe -fL -o wix-cli.msi https://github.com/wixtoolset/wix/releases/download/v6.0.2/wix-cli-x64.msi
          msiexec /i wix-cli.msi /qn /norestart
          if ($LASTEXITCODE -ne 0) { throw "wix MSI install failed" }
          $wix = (Get-Command wix.exe -ErrorAction SilentlyContinue).Source
          if (-not $wix) {
            foreach ($c in "C:\Program Files\WiX\wix.exe", "C:\Program Files (x86)\WiX\wix.exe") {
              if (Test-Path $c) { $wix = $c; break }
            }
          }
          if (-not $wix) { $wix = (Get-ChildItem "C:\Program Files" -Depth 2 -Filter wix.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          if (-not $wix) { throw "wix CLI not found after install" }
          & $wix --version
          Add-Content $env:GITHUB_ENV "WIX_EXE=$wix"

      - name: Stage release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "release\monkeycut"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory $stage | Out-Null
          $exe = Get-ChildItem build -Recurse -Filter monkeycut.exe | Select-Object -First 1
          if (-not $exe) { throw "monkeycut.exe not found under build\" }
          Copy-Item $exe.FullName $stage
          & "C:\Qt\$env:QT_VERSION\msvc2022_64\bin\windeployqt.exe" --no-translations --no-system-d3d-compiler --no-opengl-sw (Join-Path $stage "monkeycut.exe")
          Copy-Item ffmpeg\bin\*.dll $stage
          "staged files: $((Get-ChildItem $stage -Recurse -File).Count)"

      - name: Build MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = (Select-String -Path CMakeLists.txt -Pattern 'project\(\S+ VERSION (\S+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          $ver = "$base.$env:GITHUB_RUN_NUMBER"
          New-Item -ItemType Directory -Force dist | Out-Null
          & .\package\wix\build-msi.ps1 -StageDir release\monkeycut -Version $ver -Out "dist\monkeycut-$ver-win64.msi" -Wix $env:WIX_EXE

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: monkeycut-win64
          path: dist/monkeycut-*-win64.msi

  release:
    needs: [linux, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: monkeycut-win64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: monkeycut-linux
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: MonkeyCut nightly-${{ github.run_number }}
          body: |
            Auto-built nightly from commit ${{ github.sha }}.

            - `monkeycut-*-win64.msi` — Windows x64 installer (WiX, versioned, replaces previous nightlies)
            - `monkeycut-linux-*.zip` — Linux x64 portable bundle (extract and run `./monkeycut`)
          files: |
            dist/*